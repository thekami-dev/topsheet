name: Publish to Play Store

on:
  push:
    branches: [ internal, closed-testing, open-testing, production ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Create key.properties
        run: |
          cat <<PROPS > android/key.properties
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=release.keystore
          PROPS

      - name: Read version name from pubspec
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compute versionCode (monotonic across all workflows/branches)
        id: code
        run: |
          CODE=$(git rev-list --count HEAD)
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Build release AAB
        run: |
          flutter build appbundle --release --obfuscate \
            --split-debug-info=build/debug-info-aab \
            --build-name=${{ steps.version.outputs.version }} \
            --build-number=${{ steps.code.outputs.code }}

      - name: Map branch to Play Console track
        id: track
        run: |
          case "${{ github.ref_name }}" in
            internal) echo "track=internal" >> "$GITHUB_OUTPUT" ;;
            closed-testing) echo "track=alpha" >> "$GITHUB_OUTPUT" ;;
            open-testing) echo "track=beta" >> "$GITHUB_OUTPUT" ;;
            production) echo "track=production" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Upload to Play Console
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.thekami.topsheet
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ steps.track.outputs.track }}
          status: completed
